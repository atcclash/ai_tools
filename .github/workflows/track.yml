name: Pool pump tracker

on:
  schedule:
    - cron: "0 */5 * * *"   # every 5 hours (UTC)
  workflow_dispatch:         # allow manual runs from the Actions tab

# Needed so the job can commit the updated state.json back to the repo.
permissions:
  contents: write

# Don't let two runs overlap.
concurrency:
  group: pump-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m pumptracker.main

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pumptracker/state.json
          # --cached catches both a brand-new (untracked) state file and edits to an existing one.
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: update pump tracker state [skip ci]"
            git push
          fi
